name: primark-prod

services:
  web:
    container_name: primark-web
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8004 --root-path /primark
    env_file: .env
    environment:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6382"
    network_mode: host
    restart: always
    mem_limit: 512m
    memswap_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    container_name: primark-redis
    image: redis:7-alpine
    command: redis-server --port 6382
    volumes:
      - redis_data:/data
    network_mode: host
    restart: always
    mem_limit: 256m
    memswap_limit: 512m

  worker-product:
    container_name: primark-worker-product
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m arq app.workers.product_worker.Settings
    env_file: .env
    environment:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6382"
    network_mode: host
    restart: always
    mem_limit: 1536m
    memswap_limit: 3072m

volumes:
  redis_data:
